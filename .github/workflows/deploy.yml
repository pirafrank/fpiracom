# deploy fpira.com using GitHub Actions

name: 'Build and Deploy'

on:
  push:
    branches:
      - main
      - preview
    paths-ignore:
      - '.github/**'
      - '_jekyll_ignore/**'
      - README.md
      - '.gitignore'
      - 'repo_utils/**'
      - '.vscode'
      - '.vercelignore'
      - Dockerfile
      - .dockerignore
      - .editorconfig
      - '.devcontainer/**'
      - '.html_proofer_cache/**'
      - '.tasks/'
      - 'api/**/.yml'
      - 'api/**/.yaml'
  # schedule is in UTC using cron syntax
  schedule:
    - cron: '45 8 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: "branch or ref to checkout to"
        required: false
        default: ''

jobs:
  checks:
    name: Checks and Deploy Info
    runs-on: ubuntu-24.04
    outputs:
      ANY_TODAY_POST: ${{ steps.check_new_posts.outputs.ANY_TODAY_POST }}
      REF_NAME: ${{ steps.get_current_ref.outputs.ref }}
      VERCEL_ALIAS: ${{ steps.get_deployment_info.outputs.vercel_alias }}
      VERCEL_ARGS: ${{ steps.get_deployment_info.outputs.vercel_args }}
      ENV_NAME: ${{ steps.get_deployment_info.outputs.env_name }}
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}
      - name: Check for new blog posts
        id: check_new_posts
        uses: ./.github/actions/check-for-today-posts
      - name: Get current ref (branch name or commit id)
        id: get_current_ref
        uses: ./.github/actions/get-current-ref
      - name: Get deployment info
        id: get_deployment_info
        uses: ./.github/actions/get-deployment-info
        with:
          ref: ${{ steps.get_current_ref.outputs.ref }}

  related:
    name: Regenerate related posts
    runs-on: ubuntu-24.04
    # this job is allowed to fail, so that the build and deploy job can still run.
    # job may fail if OPENAI credits are exhausted.
    continue-on-error: true
    steps:
    - name: Clone repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    # Check if current commit has changes in the _posts directory
    - name: Check for _posts changes
      if: github.ref == 'refs/heads/main'
      id: check_posts_changes
      run: |
        if [ -n "$(git diff-tree --no-commit-id --name-only -r origin/main _posts)" ]; then
          echo "There are changes in the _posts directory"
          echo "RUN_RELATED=true" >> $GITHUB_OUTPUT
        else
          echo "There are no changes in the _posts directory"
          echo "RUN_RELATED=false" >> $GITHUB_OUTPUT
        fi
    # prepare Jekyll environment...
    - name: Setup Jekyll environment
      if: github.ref == 'refs/heads/main' && steps.check_posts_changes.outputs.RUN_RELATED == 'true'
      uses: ./.github/actions/setup-jekyll-env
    # ...and regenerate related posts
    # only if we are on the main branch.
    - name: Regenerate related posts
      if: github.ref == 'refs/heads/main' && steps.check_posts_changes.outputs.RUN_RELATED == 'true'
      uses: ./.github/actions/regenerate-related
      with:
        JEKYLL_ENV: production
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_COMMIT_CHANGES: ${{ vars.RUN_COMMIT_CHANGES }}

  build:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.checks.outputs.ENV_NAME }}
      url: ${{ steps.deploy_to_vercel.outputs.preview-url }}
    concurrency: ${{ needs.checks.outputs.ENV_NAME }}
    needs: [checks, related]
    if: contains(needs.checks.outputs.ANY_TODAY_POST, 'true')
    steps:
    - name: Clone repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.target_ref || github.ref }}
        fetch-tags: true

    # Prepare environment
    - name: Setup Jekyll environment
      uses: ./.github/actions/setup-jekyll-env
    - name: Setup Node environment
      uses: ./.github/actions/setup-nodejs
      with:
        node-version-file: .nvmrc
    - name: Write git info to site data
      uses: ./.github/actions/git-info
      with:
        target_file: _data/git.json

    # Perform CI checks
    - name: CI checks
      uses: ./.github/actions/ci-checks
      if: github.ref == 'refs/heads/main'

    # Be sure calendars have CRLF line endings
    - name: dos2unix
      run: |
        sudo apt install -y dos2unix
        unix2dos calendars/*.ics

    # Vercel deploy
    - name: Deploy on Vercel
      id: deploy_to_vercel
      uses: amondnet/vercel-action@v42.3.0
      with:
        # analytics env vars are set on Vercel bc build happens there!
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args:  ${{ needs.checks.outputs.VERCEL_ARGS }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        alias-domains: |
          ${{ needs.checks.outputs.VERCEL_ALIAS }}

    # Algolia search index update
    - name: Update Algolia Index
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        JEKYLL_ENV: production
        ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      run: |
        bundle exec jekyll algolia

    # In good and bad times, let me know how it went.
    # This must stay at the bottom of the job.
    - name: Send Build Push Notification
      uses: fjogeleit/http-request-action@v2
      if: always()
      with:
        url: ${{ secrets.NOTIFICATION_WEBHOOK_URI }}
        method: 'POST'
        data: '{ "value1": "[GitHub] pirafrank/fpiracom", "value2": "Build of fpira.com (ref ${{ needs.checks.outputs.REF_NAME }}) and Algolia index update finished with status ${{job.status}}.<br>Vercel deployment: ${{ steps.deploy_to_vercel.outputs.preview-name }}<br>Vercel preview URL: ${{ steps.deploy_to_vercel.outputs.preview-url }}", "value3": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }'

