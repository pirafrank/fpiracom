  - Recently I've made Telegram channels for [OPNsense Updates](https://t.me/opnsenseupdates) and [Apple Developer releases](https://t.me/appledeveloperreleases). Updates are published as soon as they're out.
  - Help me pushing [this idea](https://connect.mozilla.org/t5/ideas/ability-to-rearrange-firefox-containers-in-manage-containers/idi-p/12447) forward on Firefox on Mozilla Connect by voting it. Thank you!
